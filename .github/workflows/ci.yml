name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (domínio, servidor, nuvem, interfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm -r run typecheck
      - name: Testes unitários e de integração
        run: pnpm -r run test
      - name: Build da interface local
        run: pnpm --filter @rupbar/local-ui build
      - name: Build do painel online
        run: pnpm --filter @rupbar/owner-panel build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Empacotar servidor
        run: pnpm --filter @rupbar/server bundle
      - name: Teste ponta a ponta (Chromium)
        run: |
          pnpm --filter @rupbar/e2e exec playwright install --with-deps chromium
          node tests/e2e/smoke.mjs tests/e2e/screenshots
          node tests/e2e/stock.mjs tests/e2e/screenshots/stock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: tests/e2e/screenshots
          if-no-files-found: ignore

  rust:
    name: Rust (serviço e app Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Dependências do Tauri (Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Serviço (Linux e Windows)
        run: |
          cargo check --manifest-path apps/service-host/Cargo.toml
          cargo check --manifest-path apps/service-host/Cargo.toml --target x86_64-pc-windows-msvc
      - name: App desktop
        run: |
          mkdir -p apps/desktop/src-tauri/resources/server && touch apps/desktop/src-tauri/resources/rupbar-service.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-installer:
    name: Instalador Windows (NSIS)
    needs: [test, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Interface e servidor
        run: |
          pnpm --filter @rupbar/local-ui build
          pnpm --filter @rupbar/server bundle
      - name: Serviço do Windows
        run: cargo build --release --manifest-path apps/service-host/Cargo.toml
      - name: Recursos do instalador (Node.js oficial verificado por SHA-256)
        run: pnpm --filter @rupbar/desktop prepare-resources
      - name: Build do instalador
        run: pnpm --filter @rupbar/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: RupBar-instalador-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
