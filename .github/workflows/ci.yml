name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (domínio, servidor, nuvem, interfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm -r run typecheck
      - name: Testes unitários e de integração
        run: pnpm -r run test
      - name: Build da interface local
        run: pnpm --filter @rupbar/local-ui build
      - name: Build do painel online
        run: pnpm --filter @rupbar/owner-panel build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Empacotar servidor
        run: pnpm --filter @rupbar/server bundle
      - name: Teste ponta a ponta (Chromium)
        run: |
          pnpm --filter @rupbar/e2e exec playwright install --with-deps chromium
          node tests/e2e/smoke.mjs tests/e2e/screenshots
          node tests/e2e/stock.mjs tests/e2e/screenshots/stock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: tests/e2e/screenshots
          if-no-files-found: ignore

  rust:
    name: Rust (serviço e app Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Dependências do Tauri (Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Serviço (Linux e Windows)
        run: |
          cargo check --manifest-path apps/service-host/Cargo.toml
          cargo check --manifest-path apps/service-host/Cargo.toml --target x86_64-pc-windows-msvc
      - name: App desktop
        run: |
          mkdir -p apps/desktop/src-tauri/resources/server && touch apps/desktop/src-tauri/resources/rupbar-service.exe
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  android:
    name: App Android do garçom (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Sem Gradle Wrapper no repositório: versão fixa instalada pela action.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Chave de assinatura (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rupbar-garcom.jks"
            echo "RUPBAR_KEYSTORE=$RUNNER_TEMP/rupbar-garcom.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o segredo ANDROID_KEYSTORE_BASE64 o APK é assinado com uma chave de depuração temporária; para atualizar o app nos celulares pode ser preciso desinstalar a versão anterior."
          fi
      - name: Build do APK
        working-directory: apps/android
        env:
          RUPBAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUPBAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUPBAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Conferir assinatura e renomear
        run: |
          apk=$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          mkdir -p apps/android/dist
          cp "$apk" apps/android/dist/rupbar-garcom.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs apps/android/dist/rupbar-garcom.apk
          "$tools/aapt2" dump badging apps/android/dist/rupbar-garcom.apk | head -n 4
      - uses: actions/upload-artifact@v4
        with:
          name: RupBar-app-android
          path: apps/android/dist/rupbar-garcom.apk
          if-no-files-found: error
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/dist/rupbar-garcom.apk

  windows-installer:
    name: Instalador Windows (NSIS)
    needs: [test, rust, android]
    # Se só o app Android falhar, o instalador sai mesmo assim (sem o APK).
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.rust.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Interface e servidor
        run: |
          pnpm --filter @rupbar/local-ui build
          pnpm --filter @rupbar/server bundle
      - name: Serviço do Windows
        run: cargo build --release --manifest-path apps/service-host/Cargo.toml
      - name: App Android do garçom (servido pelo PC em /download/rupbar-garcom.apk)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: RupBar-app-android
          path: apps/android/dist
      - name: Recursos do instalador (Node.js oficial verificado por SHA-256)
        run: pnpm --filter @rupbar/desktop prepare-resources
      - name: Build do instalador
        run: pnpm --filter @rupbar/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: RupBar-instalador-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
