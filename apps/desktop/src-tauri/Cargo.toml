[package]
name = "rupbar-desktop"
version = "0.6.1"
description = "RupBar — gestão para bares (by Ruptix)"
authors = ["Ruptix"]
edition = "2021"
publish = false

[lib]
name = "rupbar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
