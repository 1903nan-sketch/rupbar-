<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RupBar</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(900px 500px at 15% -10%, #3a2a0a, #000 60%); color: #f5f5f7;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 460px; padding: 24px; }
      img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
      p { margin: 0; color: #a1a1a6; line-height: 1.45; }
      .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.2); border-top-color: #ff9f0a; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 18px; background: #ff9f0a; color: #1d1d1f; cursor: pointer; }
      .sig { position: fixed; bottom: 18px; font-size: 12px; color: #6e6e73; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="icon.svg" alt="" />
      <h1>RupBar</h1>
      <div id="loading" class="box" style="padding:0">
        <div class="spinner"></div>
        <p id="msg">Iniciando o servidor local…</p>
      </div>
      <div id="error" class="box hidden" style="padding:0">
        <p id="err"></p>
        <button id="retry">Tentar novamente</button>
      </div>
    </div>
    <div class="sig">RupBar by Ruptix</div>
    <script>
      // A janela do Windows abre esta tela local, garante que o serviço do
      // RupBar está ativo e então carrega a interface servida por ele.
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
      const $ = (id) => document.getElementById(id);
      async function boot() {
        $('loading').classList.remove('hidden');
        $('error').classList.add('hidden');
        try {
          const how = await invoke('ensure_server');
          $('msg').textContent = how === 'running' ? 'Conectando…' : 'Iniciando o serviço do RupBar…';
          for (let i = 0; i < 90; i++) {
            const st = await invoke('server_status');
            if (st.ok) return void (location.href = st.url);
            await new Promise((r) => setTimeout(r, 500));
          }
          throw new Error('O servidor local não respondeu. Verifique o serviço "RupBar Server" ou os registros em C:\\ProgramData\\RupBar\\logs.');
        } catch (e) {
          $('loading').classList.add('hidden');
          $('error').classList.remove('hidden');
          $('err').textContent = String(e && e.message ? e.message : e);
        }
      }
      $('retry').onclick = boot;
      boot();
    </script>
  </body>
</html>
